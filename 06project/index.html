
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savneet's Nineteenth 🎀</title>
  <link rel="stylesheet" href="style.css">
  <script src="first.js" defer></script>
</head>
<body>

  <!-- Blurry birthday photo collage -->
  <div class="photo-wall">
    <img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&w=900&q=85" alt="Birthday cake">
    <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=900&q=85" alt="Party balloons">
    <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=900&q=85" alt="Birthday decorations">
    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=900&q=85" alt="Party lights">
    <img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=900&q=85" alt="Celebration cake">
    <img src="https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=900&q=85" alt="Party decorations">
    <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?auto=format&fit=crop&w=900&q=85" alt="Birthday party">
    <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=900&q=85" alt="Party table">
  </div>

  <div class="pink-haze"></div>

  <!-- Decorative scrapbook stickers -->
  <div class="sticker sticker-left">୨୧</div>
  <div class="sticker sticker-right">♡</div>
  <div class="sticker sticker-top">HAPPY BIRTHDAY</div>
  <div class="sticker sticker-bottom">✦ 19 & magical ✦</div>

  <!-- Main countdown cake -->
  <main class="birthday">
    <p class="overline">A DAY MADE FOR YOU</p>

    <h1>Savneet's <em>19th</em></h1>

    <div class="ribbon ribbon-top">
      <span>୨୧</span>
    </div>

    <div class="cake">
      <div class="candles">
        <div class="candle"><i></i></div>
        <div class="candle"><i></i></div>
        <div class="candle"><i></i></div>
        <div class="candle"><i></i></div>
        <div class="candle"><i></i></div>
      </div>

      <div class="cake-top">
        
      </div>

<div class="candles">
  <div class="candle candle-pink"><span class="flame"></span></div>
  <div class="candle candle-cream"><span class="flame"></span></div>
  <div class="candle candle-pink"><span class="flame"></span></div>
  <div class="candle candle-cream"><span class="flame"></span></div>
  <div class="candle candle-pink"><span class="flame"></span></div>
</div>


      <div class="cake-tier">
        <span id="days">000</span>
        <small>DAYS TO GO</small>
      </div>

      <div class="icing-drips">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="cake-base">
        <div>
          <span id="hours">00</span>
          <small>HRS</small>
        </div>
        <b>♡</b>
        <div>
          <span id="minutes">00</span>
          <small>MIN</small>
        </div>
        <b>♡</b>
        <div>
          <span id="seconds">00</span>
          <small>SEC</small>
        </div>
      </div>

      <div class="cake-plate"></div>
    </div>

    <p class="birthday-date">JANUARY 23, 2027</p>

    <div class="bottom-ribbon">made of wishes & little things ♡</div>
  </main>

  <div class="grain"></div>

</body>
</html>
