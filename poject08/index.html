<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clicker</title>

    <style>
        body {
            background-color: black;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .circle {
            width: 50px;
            height: 50px;

            position: absolute;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 10px;

            animation: grow 5s forwards;
        }

        @keyframes grow {

            0% {
                transform: scale(1);
                opacity: 1;
                font-size: 10px;
            }

            100% {
                transform: scale(3);
                opacity: 0;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<script>
    const body = document.querySelector("body");

    body.addEventListener("click", function(e) {

        console.log("CLICK!");

        const circle = document.createElement("div");

        circle.classList.add("circle");

        circle.textContent = "viah kb?";

        const colors = [
            "red",
            "blue",
            "pink",
            "navy",
            "white",
            "orange"
        ];

        const randomIndex = Math.floor(
            Math.random() * colors.length
        );

        circle.style.backgroundColor = colors[randomIndex];

        circle.style.left = (e.clientX - 25) + "px";
        circle.style.top = (e.clientY - 25) + "px";

        body.appendChild(circle);

        setTimeout(function() {
            circle.remove();
        }, 5000);

    });
</script>

</body>
</html>
