<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income tax calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: antiquewhite;color:brown ;display:flex;align-items:center;justify-content:center">
  <div id="parent">
    <div class="icon">₹</div>
    <h1>Income Tax Calculator</h1>
    <p class="subtitle">Calculate your annual income tax in seconds</p>
    <form>
        <label for="income">Annual Income (₹)</label>
        <input type="number" id="income" name="income" placeholder="Enter your annual income" min="0" step="1" required>
        <br>
        <br>
        <button type="submit">Calculate Income Tax →</button>
    </form>
    <div class="result-box" aria-live="polite">
      <P>Total tax to be paid</P>
      <h2>₹ 0</h2>

    </div>
    <p class="footer">Simple,quick and easy tax calculation.</p>
  </div>  
</body>
<script src="first.js"></script>
</html>
